version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"

  frontend:
    build: 
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "8501:8501"
    environment:
      AI_COS_API_URL: http://backend:8000/api/v1
    depends_on:
      - backend
